- :title: デプロイの先まで全部面倒を見る ― Kamal を社内 PaaS に育てた話
  :abstract: "「試しにアプリをデプロイしたい」— そう思っても、サーバーの準備に加えて DB やストレージを整えるにはインフラの知識が必要で、\"ちょっと試す\"
    には敷居が高い。結局ローカルで動かして終わり、という経験はないでしょうか。\r\n\r\nRails 8 に標準搭載された Kamal を使うと、自前サーバーへのデプロイ自体はコマンド一発になります。それでも「アプリを動かすこと」までで、DB
    やストレージの準備、複数サーバーをうまく扱う運用の手間は、変わらず残ります。\r\n\r\nそこで、Kamal を土台に、その \"残り\" を丸ごと引き受ける社内
    PaaS を Rails で作りました。リポジトリを選んでボタンを押すだけでサービスが動き出す、例えるなら社内版 Heroku です。\r\n狙いは \"動かす\"
    だけではなく、限られたサーバー群に多数のアプリを安全に同居させ、実運用に耐えること。複数サーバーへの自動分散やゼロダウンタイム入れ替えも裏側で担います。運用もデバッグもブラウザだけで完結。さらに
    API を通じて、AI Agent に会話で原因調査や修正まで任せられます。\r\n\r\n本発表では、Kamal にどこまで任せ、どこを作り込んだのかを紹介しながら、「インフラの仕組みも、使い慣れた
    Rails の道具で作れる」という実感を、きっと持ち帰ってもらえるはずです。"
