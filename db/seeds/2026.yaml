- :title: その Valkey 使いこなしていますか？
  :abstract: "Valkey (Redis) は単なる KVS ではありません。多彩なデータ構造を備えたインメモリデータストアです。\r\n\r\nそれなのに、普段のアプリケーション開発では
    session store や cache、Sidekiq の queue としてしか使っていない、というケースは少なくないのではないでしょうか。せっかくそこにある機能を使わないのは、少しもったいないと思っています。\r\n\r\nこのセッションでは、まず
    Sorted Set を使ったランキング実装を題材にして Valkey のパワーを紹介します。ランキング専用のロジックをアプリケーション側に持たず、Valkey
    のデータ構造そのものに仕事を任せる設計は、とても気持ちが良いものです。\r\n\r\nさらに、公式モジュールである Valkey Search によるベクトル検索や、Bloom
    Filter のような確率的データ構造にも触れ、「Valkey をアプリケーションの機能として使う」という発想を紹介します。\r\n\r\n「Valkey
    = キャッシュ」ではもったいない。ランキング、検索、レコメンド、重複判定など、アプリケーションの中核となる機能を支えるデータストアとして Valkey を使い倒す。その面白さを、実例を交えながらお話しします。\r\n"
