- :title: 'The Revenge of the Cucumber: Safety Nets for AI Code'
  :abstract: "AI can generate code at unprecedented speed, but it can also generate
    bugs and regressions at unprecedented speed. As software creation becomes cheaper,
    the bottleneck shifts from writing code to verifying behavior.\r\n\r\nThis talk
    revisits the rise and fall of Cucumber and BDD, exploring why executable specifications
    struggled to gain adoption and how AI may have changed the economics behind them.
    We'll discuss how Ruby teams can build practical testing pipelines for AI-generated
    code using AI-assisted system tests as a safety net."
