- :title: 'Herb in Rails 8.2: Your ERB views, now HTML-aware'
  :abstract: "With teams, companies, and open source projects adopting Herb, it's
    proving itself at scale and is on track to become an opt-in view engine in Rails
    8.2. \r\n\r\nThis talk explores what Herb brings to Rails, from its ActionView
    integration to the tooling and developer experience it unlocks. Then I'll introduce
    the first production-ready version of ReActionView, bringing Phoenix LiveView-like
    fine-grained reactivity to standard HTML+ERB templates. Optional, gradual, no
    JavaScript framework, no new file format."
