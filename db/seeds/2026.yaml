- :title: Refining Active Record
  :abstract: "以下のコードのように、文字列操作やArelのようなメソッドチェインではなく、Rubyの自然な式でクエリを書きたいと思いませんか？\r\n\r\n```ruby\r\nEmployee.where
    { :age >= 50 }.select { [avg(:vacation_hours), sum(:sick_leave_hours)] }\r\n```\r\n\r\nかつてRefinementsを使ってwhereを拡張するactiverecord-refinementsというgemがありましたが、Refinementsをブロックスコープで有効にする機能が処理系の実装上の都合でRuby
    2.0から削除されてしまい、その夢は潰えました。\r\nRuby 4.1の新機能となる予定のProc#refinedを使って、activerecord-refinementsを現代に蘇らせてみましょう。\r\n"
  :start_at: !!timestamp 2026-10-17T15:50:00+09:00
  :duration_minutes: 15
  :track: Magenta Hall
