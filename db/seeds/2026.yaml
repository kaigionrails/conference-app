    :gravatar_hash: b228a25d1de35688505c7140787a5229
    :bio: "株式会社ネットワーク応用通信研究所の社長を務めています。\r\nRubyコミッタとして、callcc、Refinements、Hashの値省略記法、String#{byteindex,bytesplice}などの導入をしてきました。\r\nRailsには、ActiveRecord::Locking::Pessimisticの導入、ActiveSupport::SafeBuffer#subなどのブロック内における後方参照のサポート、その他いくつかのバグ修正を行ってきました。\r\n好きなテキストエディタはTextbringerです。"
