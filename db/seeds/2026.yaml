    :bio: "日々Railsアプリケーションを書いているプログラマ。著書に「Rails 3レシピブック(共著)」「はじめる! Cucumber」など。\r\nXPの実践を通じて、Rubyistがいきいきと働ける場を作りたいと考えている。\r\n\r\n好きなメソッドの変遷は、Array#each
      から Object#extend を経て Hash#compact。"
- :title: 全ての永続トークンを、生まれる前に消し去りたい！
  :abstract: "「すべての永続トークンを、生まれる前に消し去りたい！すべての宇宙、過去と未来の全ての永続トークンを、この手で」\r\n\r\n外部サービス連携やマイクロサービスにおいて、アクセストークンを永続的に利用可能なものに設定して使い続けたい、と思ったことはあるでしょう。しかし同時に、それがセキュリティホールであるということもなんとなく感じていることでしょう。また、トークンリフレッシュというものについて聞いたことはあるけれど、トークンのライフサイクルの管理が難しい、ということも考えたことがあるでしょう。\r\n\r\nこのトークでは、永続トークンをやめる理由、やめるための方法、その上でも気をつけるべきセキュリティ上の懸念事項などについて話します。みなさんの使う・作るサービスの認証について、改めて考えてみませんか？"
  :start_at: !!timestamp 2026-10-16T18:00:00+09:00
  :duration_minutes: 30
  :track: Lime Hall
  :speakers:
  - :name: Ryo Kajiwara (sylph01)
    :slug: sylph01
