    :bio: 株式会社スタジアム（スタメングループ）で Rails による Web サービス開発をしているエンジニアです。RubyKaigi 2026 では
      LT「The Joy of Talking to Hardware in Ruby」に登壇しました。個人では GPU まわりの効率化やエッジ端末でのプログラミングにも取り組み、mruby
      から GPU(Vulkan) を扱う gem「mruby-gpu-narray」を開発しています。最近は Raspberry Pi を ActionCable
      でつなぎ、Rails を分散システムの制御プレーンとして使う実験に取り組んでいます。Hotwire・ActionCable・mruby・GPU が好きです。
- :title: 'Browser Spec: HotwireをRubyでテストする'
  :abstract: "現代Webの動作環境において、JSは欠かすことができません。\r\nフルスタックRailsアプリケーションですら、TurboやStimulusやその他JSのコードを当たり前のように使っています。\r\nしかし、いざ動作確認をしようとすると、ヘッドレスブラウザを使ったSystem
    Specが必要となり、遅い上にflakyなテストとの戦いが勃発します。つらい。\r\n\r\n本発表では、新たなテストの枠組みとしてBrowser Specを提唱し、その実装であるDommy::Browserについて解説します。\r\nDommyはRubyで書かれたDOM実装で、Dommy::BrowserはDommy上に構築されたテスト向け軽量ブラウザです。本セッションではDommy::Browserを使って、単一のRubyプロセス内でJSを使ったWebアプリケーションのテストを行い、Railsにおけるテストの可能性を広げることに挑戦します。\r\n"
