- :title: Railsのためのパスキー実践入門 〜マルチテナントSaaSでの意思決定〜
  :abstract: "パスキーによるログインは、金融機関から大手Webサービスまで急速に広がっています。そろそろ自社のサービスでも、と思いつつ、しくみがよく分からない、何から検討すればいいのか分からない、と後回しにしていませんか。\r\n\r\nこのトークでは、まずパスキーそのものについて解説します。パスキーとは何か、どういうしくみでログインできるのかを、登録・認証のフローとRailsでの実装例とあわせて解説します。\r\n\r\nそのうえで、パスキーをマルチテナントのRailsアプリケーションに実装するときにどういう意思決定が必要になるのかを、SmartHRでの導入により得られた知見をもとに紹介します。パスキーをオートフィルで呼び出すか、専用ボタンで呼び出すかの意思決定や、サブドメインでテナントを分けるマルチテナント構成でのRP
    IDの決め方など、実際に下した判断とその理由についてお話しします。"
  :start_at: !!timestamp 2026-10-16T17:20:00+09:00
  :duration_minutes: 30
  :track: Lime Hall
