- :title: FactoryBotをやめればRSpecは速くなるのか？
  :abstract: "「いつの間にかCIの実行時間が伸びている…」\r\n\r\nRailsアプリケーションを運用するなかで、そんな経験をした方も多いのではないでしょうか？\r\n私もその一人です。\r\n\r\nCI高速化の手がかりを探していたある日、XでDHHのポストを発見しました。\r\n\r\n>
    [FactoryBot is the quickest way to kill your test suite performance with Rails.
    ... The secret? Rails Fixtures! ](https://x.com/dhh/status/1919291397909233858)\r\n\r\nこのポストに影響を受けた私は、FactoryBotをRails
    Fixturesへ移行する取り組みを始めました。\r\nしかし、単純な置き換えでは済みませんでした。また、Fixturesを使えば必ず速くなるわけでもありませんでした。\r\n\r\n本セッションでは、FactoryBotからFixturesへの移行で直面した課題や失敗を振り返りながら、`let_it_be`やFixtureKitなども含め、それぞれの手段の特徴を整理します。\r\nそのうえで、実行速度、保守性、導入コストといった観点から、改善手段を選ぶための判断軸を紹介します。"
