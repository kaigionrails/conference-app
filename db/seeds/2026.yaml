    :slug: sho-work
    :github_username: sho-work
    :gravatar_hash: 2d7a28abc5c1c3f2b2be38745e48f1b9
    :bio: "株式会社スマートバンク ソフトウェアエンジニア\r\nAI家計簿アプリ「ワンバンク」の開発・運用をしています。\r\nRuby on Rails
      による モバイルアプリケーション 向け API 開発が主な業務内容です。"
- :title: ActionCableの相手はブラウザだけじゃない — Railsでデバイス群をリアルタイム管制する
  :abstract: "ActionCable の相手は、いつもブラウザとは限りません。センサーを積んだ Raspberry Pi をコンシューマにすると、Rails
    はデバイス群にコマンドを配り、結果を受け取る「制御プレーン」になります。\r\n\r\n本発表では、その設計を実機の Raspberry Pi を繋いだ動くシステムで紹介します。物理デバイスを
    Device モデルと状態機械で扱い、heartbeat と定期照合で生死を追いかける。ActionCable を双方向の transport にして、結果は冪等に取り込む。ActiveJob
    で「実行先が物理デバイス」なジョブを組み、落ちる前提でリトライとバックプレッシャを設計する——おなじみの道具だけで、ここまで作れます。\r\n\r\n山場は「リアルタイムで
    Turbo Streams と生 ActionCable をどう使い分けるか」。毎秒届くスペクトルを HTML で撒くと転送量は約26倍、毎フレーム257個の
    DOM ノードが生まれます。実測ベンチから、低頻度の状態変化は Turbo Streams、高頻度の数値ストリームは生 ActionCable + canvas
    という判断基準を導きます。通知やダッシュボードなど、ふつうの Rails 開発にそのまま効く勘所です。\r\n\r\nライブデモとともに、見慣れた Rails
    の意外な射程をお見せします。"
  :start_at: !!timestamp 2026-10-17T13:55:00+09:00
  :duration_minutes: 30
