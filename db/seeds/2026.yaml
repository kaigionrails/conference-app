- :title: 'Solid Queue: two years on Rails'
  :abstract: 'Solid Queue 1.0 was released on 26 Sept 2024 and added as the default
    Active Job backend in Rails. Two years later, we''re ready for version 2.0 in
    a totally different world. Let''s review the basics and explore the path to a
    new major version. We''ll go through new features such as single-process mode,
    batches or sharding, the non-linear path to them, and how maintaining an open-source
    project has changed since Solid Queue got started. '
