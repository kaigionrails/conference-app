- :title: 小さく作ってわかるRailsの仕組み 〜mini-rails〜
  :abstract: "ブラウザから送られたHTTPリクエストは、Rails内で「Rack → Router → Controller → View → Response」という流れで処理されています。この仕組みを知りたいと思っても、どこから読み進めればいいのかわからずにいました。\r\nそこで、最小限のRails実装であるmini-railsを自分で作ってみることにしました。\r\n\r\n本発表では、mini-rails上で簡易的なブログが動く様子を見ながら、リクエストを受け付けてからレスポンスを返すまでの実装をお話しします。\r\n普段何気なく使っているRailsの内部がどうなっているのかを、一緒に覗いてみましょう。\r\n"
