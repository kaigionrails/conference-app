- :title: Web Framework Benchmark Battle 2026, Any%
  :abstract: "世間に出回っている「webフレームワークベンチマーク対決」みたいなコンテンツを眺めていると、Ruby on Railsは他言語のプロダクトたちに比べてかなり遅い部類のフレームワークという位置付けにされていることに気づきます。やられ役ですね。かませ犬ですね。そんな立場に甘んじているのはRailsのマーケティング上よろしくありません。どうにかしたいですね。\r\n\r\nそこで、本セッションでは、この手のベンチマークのスコアを、あらゆる手段を用いて改善してみます。要はRails本体をホゲるISUC○Nです。\r\nレギュレーションは、Any%とします。すなわち、対象のベンチマークがそれっぽく完走しさえすれば過程は問わないという競技となっています。\r\n\r\n本セッションを通じて、参加者の皆さまには、以下のようなものをお伝えできる予定です。\r\n-
    ソフトウェアのパフォーマンスをチューニングする際の考え方や進め方\r\n- Rails本体にパッチを当てる実作業の風景\r\n- OSSで遊ぶたのしさ"
