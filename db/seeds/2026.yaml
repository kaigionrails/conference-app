- :title: Hypertext on Rails — HATEOAS が示す Rails の正しさ
  :abstract: "普段Railsで開発していて、フロントエンドとバックエンドを二重に管理している感覚はありませんか？その問題の原因と解決策のひとつは、RESTの**忘れ去られた4つめの制約**にあるのかもしれません。\r\n\r\nRESTの統一インターフェースには4つの制約があります。最初の3つはRESTful
    API設計でおなじみのものです。しかし4つめは **H**ypermedia **a**s **t**he **E**ngine **o**f **A**pplication
    **S**tateという制約で、後にHATEOASと名付けられましたが、あまり多くは語られてきませんでした。\r\n\r\nFielding博士はこうも言っています。\r\n\r\n>
    REST APIs must be hypertext-driven\r\n\r\n気になります。私は「作者の気持ちを答えよ」の本当の正解が気になって仕方がないたちです。\r\nそこで、私はRailsでHATEOASを実践することをテーマに自分用の易占い（六十四卦）アプリを作り始めました。\r\n\r\n本トークでは易占いアプリの、特にHATEOASを意識した仕様や実装を紹介しながら、**アプリケーションの状態遷移をハイパーメディアに駆動させる**という設計がもたらす恩恵を具体的にお見せします。そして、普通のRailsアプリとHATEOASの関係、HotwireがHTMLを扱う必然性にも迫ります。"
