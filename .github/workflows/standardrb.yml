name: Run standardrb

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

jobs:
  standardrb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
      - name: standardrb
        run: bundle exec standardrb
