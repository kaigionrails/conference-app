name: herb analyze
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
jobs:
  herb:
    name: herb analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
      - run: bundle exec herb analyze app/
