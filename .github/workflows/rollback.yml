name: Rollback

# Roll a deployed environment back to an earlier image, without needing SSH
# access from the operator's machine. The target version must still be present
# on the host and in ECR.
#
# Note that this only moves the app back — it does not undo migrations. If the
# deploy being rolled back contained one, handle the database by hand.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - production
          - staging
      version:
        description: "Version to roll back to (full commit SHA)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: "deploy-${{ inputs.environment }}"
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      KAMAL_WEB_SERVER_ADDRESS: ${{ secrets.KAMAL_WEB_SERVER_ADDRESS }}
      KAMAL_WEB_SERVER_PRIVATE_ADDRESS: ${{ secrets.KAMAL_WEB_SERVER_PRIVATE_ADDRESS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ap-northeast-1
          role-skip-session-tagging: false
          role-to-assume: "arn:aws:iam::861452569180:role/ConferenceAppDeployer"
      - name: Set up SSH
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_KNOWN_HOSTS: ${{ secrets.KAMAL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KAMAL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Roll back
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "staging" ]; then
            bundle exec kamal rollback "$TARGET_VERSION" -d staging
          else
            bundle exec kamal rollback "$TARGET_VERSION"
          fi
