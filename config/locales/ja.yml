ja:
  about:
    index:
      title: "Conference Appについて"
      about_this_app: このアプリは、%{event_name}に参加する皆様がイベントをより楽しく過ごせるように作成されたRailsアプリケーションです。以下の機能を提供します。
      feature_sessions: セッションの一覧機能
      feature_sessions_description1: 右上のアイコンを押すとメニューが開き、そこから「Talks」をクリックすることでセッションの一覧を見ることができます。
      feature_sessions_description2: セッションはブックマークすることができます。通知を有効にしている場合、ブックマークしたトークの開始前にプッシュ通知が行われます。
      feature_announcements: 運営からのアナウンス
      feature_announcements_description1: カンファレンスの進行について、運営側から参加者の皆さまに向けてアナウンスを行うことがあります。それらのアナウンスを確認することができます。
      feature_announcements_description2: アナウンスについてはログインせずに見ていただくことができます。ログインし、通知を有効にしている場合は新規のアナウンス時に通知されます。
      feature_profile: プロフィール登録・交換
      feature_profile_description1: Conference Appには、あなたのプロフィールを登録することができます。
      feature_profile_description2: 登録したプロフィールは、QRコードで他の参加者の方と交換することができます。SNSアカウントの共有などでご活用ください。
      feature_push_notification: プッシュ通知
      feature_push_notification_description1: ブックマークしたセッションの発表時刻および運営からのアナウンス作成時に、プッシュ通知を有効にすることができます。
      feature_push_notification_description2: 詳細については、右上のアイコンからの「Setting」にてご確認ください。
      feature_push_notification_setting_link: こちらからも開くことができます。
      need_github_login: このアプリの機能を活用していただくためには、GitHubアカウントでログインしていただく必要があります。
      github_login_flow: 以下のボタンから、GitHubアカウントでのログインをお願いします。
      contributors: コントリビューター
      app_contributors: conference-appは以下のコントリビューターによって開発されています(コミット数順）。
      policies: "プライバシーポリシーと利用規約"
      policies_description1: "本アプリのプライバシーポリシーと利用規約は、以下のページに掲載しています。"
      policies_link: "プライバシーポリシーと利用規約を読む"
  policies:
    index:
      title: "Policies"
      authoritative_notice: "この文書は日本語版を正文とします。"
      established_on: "制定日: 2026年9月23日"
      last_updated_on: "最終改定日: 2026年9月23日"
      privacy_title: "プライバシーポリシー"
      privacy_description1: "Kaigi on Rails Team（以下「運営」）は、Conference App（以下「本アプリ」）で取り扱う利用者の情報について、以下のとおり定めます。"
      privacy_operator: "運営者"
      privacy_operator_description1: "本アプリは Kaigi on Rails Team が運営しています。"
      privacy_operator_description2: "本ポリシーに関するお問い合わせや、情報の削除のご依頼は、以下のメールアドレスまでご連絡ください。"
      privacy_collected_data: "取得する情報"
      privacy_collected_data_description1: "本アプリは、以下の情報を取得します。"
      privacy_collected_data_github: "GitHub でログインしたときに GitHub から受け取る情報: GitHub のユーザー ID、ユーザー名（本アプリのハンドル名として使います）、アバター画像。また、運営スタッフ用の権限を決めるため、GitHub の kaigionrails organization に所属しているかどうかを確認します。"
      privacy_collected_data_profile: "利用者が登録する情報: 表示名、自己紹介、プロフィール画像、選択したバッジ。"
      privacy_collected_data_activity: "本アプリの利用に伴う記録: セッションのブックマークとリマインダー、お知らせの既読状態、プロフィール交換の記録（誰と、どのイベントで交換したか）。"
      privacy_collected_data_sponsor_visit: "スポンサーブースのスタンプラリーの記録: どのイベントで、どのスポンサーのブースのスタンプを、いつ獲得したか。"
      privacy_collected_data_ticket: "チケットの情報: チケット販売サービス Tito から受け取るチケットの参照番号と状態。チェックインしたときに、利用者のアカウントと紐付けます。氏名やメールアドレスは保存しません。"
      privacy_collected_data_webpush: "プッシュ通知を有効にしたときの購読情報: ブラウザのプッシュ通知の送信先 URL と暗号鍵。"
      privacy_collected_data_locale: "表示言語の設定。"
      privacy_collected_data_operator_account: "運営スタッフがメールアドレスとパスワードでログインする場合は、そのメールアドレスとパスワード。パスワードはハッシュ化して保存します。"
      privacy_collected_data_access_log: "アクセスログとエラーの情報: IP アドレス、ブラウザの種類（User-Agent）、アクセスした URL、日時、発生したエラーの内容。"
      privacy_purpose: "利用目的"
      privacy_purpose_description1: "取得した情報は、以下の目的で利用します。"
      privacy_purpose_login: "ログインと本人確認のため。"
      privacy_purpose_features: "本アプリの機能（セッション一覧、お知らせ、プッシュ通知、プロフィールの登録と交換、スポンサーブースのスタンプラリーなど）を提供するため。"
      privacy_purpose_operation: "不具合の調査と対応、性能の改善、不正な利用への対応のため。"
      privacy_purpose_description2: "運営スタッフは、イベントの運営に必要な範囲で、管理画面から利用者のアカウント、プロフィール、チケットとの紐付けを閲覧します。"
      privacy_public_profile: "公開される情報"
      privacy_public_profile_description1: "利用者のプロフィールページ（/@ハンドル名）は、ログインしていない人を含め、誰でも閲覧できます。"
      privacy_public_profile_description2: "プロフィールページには、ハンドル名、表示名、プロフィール画像、自己紹介、バッジ、プロフィールを交換した相手の一覧が表示されます。"
      privacy_public_profile_description3: "スタンプラリーの記録は本人だけが閲覧でき、プロフィールページには表示されません。ただし、参加者全体で獲得したスタンプの合計数は、ログインした利用者のスタンプ帳に表示します。"
      privacy_external_services: "外部サービスの利用"
      privacy_external_services_description1: "本アプリは、以下の外部サービスを利用しています。これらのサービスには、それぞれの目的に必要な範囲で情報が送信されます。"
      privacy_external_services_github: "GitHub: ログインと、運営スタッフかどうかの確認。"
      privacy_external_services_tito: "Tito: チケットの情報の受け取り。"
      privacy_external_services_cloudflare: "Cloudflare: プロフィール画像の保存（R2）と、ライブ配信（Stream）。"
      privacy_external_services_aws: "Amazon Web Services: 本アプリのホスティング、配信、ログの保存。東京リージョンを利用しています。"
      privacy_external_services_sentry: "Sentry: エラーの監視。"
      privacy_external_services_scout: "Scout APM: 性能の監視。"
      privacy_external_services_webpush: "各ブラウザのプッシュ通知サービス: プッシュ通知の配送。"
      privacy_external_services_gravatar: "Gravatar: 登壇者の画像の表示。閲覧者のブラウザが gravatar.com から画像を読み込みます。"
      privacy_cookie: "Cookie"
      privacy_cookie_description1: "本アプリは、ログイン状態の保持と、なりすましたリクエストの防止（CSRF 対策）のために、セッション Cookie を 1 つ使います。有効期限は 5 日です。"
      privacy_cookie_description2: "アクセス解析や広告のための Cookie は使いません。"
      privacy_retention: "保存期間と削除"
      privacy_retention_description1: "取得した情報は、利用目的に必要な期間保存します。アカウントとプロフィールの情報は、年をまたいで次回以降のイベントでも使えるように保存します。"
      privacy_retention_description2: "プロフィール画像、ブックマーク、プッシュ通知の購読は、利用者自身が本アプリから削除できます。"
      privacy_retention_description3: "アカウントを含む情報の削除をご希望の場合は、上記のお問い合わせ先までご連絡ください。運営が対応します。"
      privacy_third_party: "第三者への提供"
      privacy_third_party_description1: "運営は、法令に基づく場合を除き、利用者の同意なく情報を第三者に提供しません。"
      privacy_third_party_description2: "スポンサーには、ブースごとの訪問数など、個人を特定できない集計値を共有することがあります。個々の利用者がどのブースを訪問したかは提供しません。"
      privacy_revision: "改定"
      privacy_revision_description1: "運営は、必要に応じて本ポリシーを改定します。改定した場合は、このページでお知らせします。"
      terms_title: "利用規約"
      terms_scope: "適用範囲"
      terms_scope_description1: "本規約は、Kaigi on Rails Team（以下「運営」）が提供する Conference App（以下「本アプリ」）の利用に関する条件を定めるものです。"
      terms_scope_description2: "利用者は、本アプリにログインした時点、またはログインせずに本アプリを利用した時点で、本規約に同意したものとみなします。"
      terms_account: "アカウント"
      terms_account_description1: "本アプリのアカウントは、利用者の GitHub アカウントでログインすることで作成されます。"
      terms_account_description2: "利用者は、自身のアカウントを第三者に利用させてはいけません。"
      terms_prohibited: "禁止事項"
      terms_prohibited_description1: "利用者は、本アプリの利用にあたり、以下の行為をしてはいけません。"
      terms_prohibited_impersonation: "他人になりすます行為。"
      terms_prohibited_inappropriate_profile: "他人を傷つける、または公序良俗に反する表示名、自己紹介、プロフィール画像を登録する行為。"
      terms_prohibited_unauthorized_access: "本アプリや他の利用者のアカウントに不正にアクセスする行為。"
      terms_prohibited_disruption: "本アプリやイベントの運営を妨げる行為。"
      terms_prohibited_code_of_conduct: "Kaigi on Rails のアンチハラスメントポリシーに反する行為。"
      terms_prohibited_law: "法令に違反する行為。"
      terms_content: "利用者が登録した内容の扱い"
      terms_content_description1: "利用者が登録した表示名、自己紹介、プロフィール画像などの権利は、利用者に帰属します。"
      terms_content_description2: "利用者は、運営がそれらの内容を本アプリの中で表示するために利用することを許諾するものとします。"
      terms_content_description3: "運営は、本規約に違反すると判断した内容を、事前の通知なく削除できます。"
      terms_service_change: "本アプリの変更、停止、終了"
      terms_service_change_description1: "運営は、事前の通知なく本アプリの内容を変更し、または本アプリの提供を停止もしくは終了できます。"
      terms_disclaimer: "免責"
      terms_disclaimer_description1: "運営は、本アプリが常に利用できること、不具合がないことを保証しません。イベントの開催中に本アプリが利用できない場合も同様です。"
      terms_disclaimer_description2: "運営は、本アプリの利用によって利用者に生じた損害について、運営の故意または重大な過失による場合を除き、責任を負いません。"
      terms_revision: "規約の改定"
      terms_revision_description1: "運営は、必要に応じて本規約を改定します。改定した場合は、このページでお知らせします。改定後に本アプリを利用した利用者は、改定後の規約に同意したものとみなします。"
      terms_governing_law: "準拠法"
