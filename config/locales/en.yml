en:
  about:
    index:
      title: "About the Conference App"
      about_this_app: "This app is a Rails application created to help participants of %{event_name} enjoy the event more. It provides the following features:"
      feature_sessions: "List sessions"
      feature_sessions_description1: "Click the icon at the top right to open the menu, then click 'Talks' to view the list of sessions."
      feature_sessions_description2: "You can bookmark sessions. If notifications are enabled, you will receive push notifications before bookmarked talks begin."
      feature_announcements: "Announcements from Organizers"
      feature_announcements_description1: "The organizers may make announcements to participants about conference proceedings. You can check those announcements here."
      feature_announcements_description2: "You can view announcements without logging in. If you are logged in with notifications enabled, you will be notified of new announcements."
      feature_profile: "Profile Registration & Exchange"
      feature_profile_description1: "You can register your profile in the Conference App."
      feature_profile_description2: "You can exchange your registered profile with other participants via QR code. Please use this to share social media accounts."
      feature_push_notification: "Push Notifications"
      feature_push_notification_description1: "You can enable push notifications for bookmarked session times and announcements from organizers."
      feature_push_notification_description2: "For details, please check 'Settings' from the icon at the top right."
      feature_push_notification_setting_link: "You can also open it from here."
      need_github_login: "To use the features of this app, you need to log in with your GitHub account."
      github_login_flow: "Please log in with your GitHub account using the button below."
      contributors: "Contributors"
      app_contributors: "conference-app is developed by the following contributors (ordered by number of commits)."
      policies: "Privacy Policy and Terms of Service"
      policies_description1: "The privacy policy and terms of service for this app are on the following page."
      policies_link: "Read the Privacy Policy and Terms of Service"
  policies:
    index:
      title: "Policies"
      authoritative_notice: "This English version is a reference translation. If it differs from the Japanese version, the Japanese version prevails."
      established_on: "Established: September 23, 2026"
      last_updated_on: "Last updated: September 23, 2026"
      privacy_title: "Privacy Policy"
      privacy_description1: "Kaigi on Rails Team (\"we\") sets out below how Conference App (\"the app\") handles information about its users."
      privacy_operator: "Operator"
      privacy_operator_description1: "The app is operated by Kaigi on Rails Team."
      privacy_operator_description2: "For questions about this policy, or to ask us to delete your information, please contact us at the address below."
      privacy_collected_data: "Information we collect"
      privacy_collected_data_description1: "The app collects the following information."
      privacy_collected_data_github: "What we receive from GitHub when you log in with GitHub: your GitHub user ID, your username (used as your handle in the app), and your avatar image. To decide staff permissions, we also check whether you are a member of the kaigionrails organization on GitHub."
      privacy_collected_data_profile: "What you register: your display name, bio, profile images, and the badges you choose."
      privacy_collected_data_activity: "Records of your use of the app: session bookmarks and reminders, which announcements you have read, and profile exchanges (with whom, and at which event)."
      privacy_collected_data_ticket: "Ticket information: the ticket reference and state we receive from Tito, the ticketing service. The ticket is linked to your account when you check in. We do not store your name or email address."
      privacy_collected_data_webpush: "Push notification subscriptions, if you enable them: the URL your browser receives push notifications at, and its encryption keys."
      privacy_collected_data_locale: "Your display language setting."
      privacy_collected_data_operator_account: "For staff who log in with an email address and password: that email address and password. The password is stored hashed."
      privacy_collected_data_access_log: "Access logs and error information: IP address, browser type (User-Agent), the URL accessed, the time, and details of any error that occurred."
      privacy_purpose: "How we use it"
      privacy_purpose_description1: "We use this information to:"
      privacy_purpose_login: "log you in and identify you;"
      privacy_purpose_features: "provide the app's features, such as the session list, announcements, push notifications, and profile registration and exchange;"
      privacy_purpose_operation: "investigate and fix problems, improve performance, and deal with misuse."
      privacy_purpose_description2: "Event staff view accounts, profiles, and their linked tickets in the admin console, to the extent needed to run the event."
      privacy_public_profile: "What is public"
      privacy_public_profile_description1: "Your profile page (/@your-handle) can be viewed by anyone, including people who are not logged in."
      privacy_public_profile_description2: "It shows your handle, display name, profile images, bio, badges, and the list of people you have exchanged profiles with."
      privacy_external_services: "External services"
      privacy_external_services_description1: "The app uses the following external services. Information is sent to each of them as far as needed for its purpose."
      privacy_external_services_github: "GitHub: logging in, and checking whether you are staff."
      privacy_external_services_tito: "Tito: receiving ticket information."
      privacy_external_services_cloudflare: "Cloudflare: storing profile images (R2) and live streaming (Stream)."
      privacy_external_services_aws: "Amazon Web Services: hosting, content delivery, and log storage, in the Tokyo region."
      privacy_external_services_sentry: "Sentry: error monitoring."
      privacy_external_services_scout: "Scout APM: performance monitoring."
      privacy_external_services_webpush: "Your browser's push notification service: delivering push notifications."
      privacy_external_services_gravatar: "Gravatar: showing speakers' images. Your browser loads these images from gravatar.com."
      privacy_cookie: "Cookies"
      privacy_cookie_description1: "The app uses a single session cookie to keep you logged in and to protect against forged requests (CSRF). It expires after 5 days."
      privacy_cookie_description2: "We do not use cookies for analytics or advertising."
      privacy_retention: "Retention and deletion"
      privacy_retention_description1: "We keep information for as long as it is needed for the purposes above. Account and profile information is kept across years so that you can use it at future events."
      privacy_retention_description2: "You can delete your profile images, bookmarks, and push notification subscriptions yourself in the app."
      privacy_retention_description3: "If you would like other information deleted, including your account, please contact us at the address above and we will take care of it."
      privacy_third_party: "Sharing with third parties"
      privacy_third_party_description1: "We do not share your information with third parties without your consent, except where required by law."
      privacy_revision: "Changes to this policy"
      privacy_revision_description1: "We may revise this policy when needed. When we do, we will announce it on this page."
      terms_title: "Terms of Service"
      terms_scope: "Scope"
      terms_scope_description1: "These terms set out the conditions for using Conference App (\"the app\"), provided by Kaigi on Rails Team (\"we\")."
      terms_scope_description2: "By logging in to the app, or by using it without logging in, you agree to these terms."
      terms_account: "Accounts"
      terms_account_description1: "An account in the app is created when you log in with your GitHub account."
      terms_account_description2: "You must not let anyone else use your account."
      terms_prohibited: "Prohibited conduct"
      terms_prohibited_description1: "When using the app, you must not:"
      terms_prohibited_impersonation: "impersonate anyone else;"
      terms_prohibited_inappropriate_profile: "register a display name, bio, or profile image that hurts others or is offensive;"
      terms_prohibited_unauthorized_access: "access the app or other users' accounts without authorization;"
      terms_prohibited_disruption: "interfere with the app or with running the event;"
      terms_prohibited_code_of_conduct: "violate the Kaigi on Rails Anti-Harassment Policy;"
      terms_prohibited_law: "break the law."
      terms_content: "What you register"
      terms_content_description1: "You keep the rights to what you register, such as your display name, bio, and profile images."
      terms_content_description2: "You allow us to use that content to display it within the app."
      terms_content_description3: "We may remove, without notice, any content we judge to violate these terms."
      terms_service_change: "Changes to the app, suspension, and termination"
      terms_service_change_description1: "We may change the app, or suspend or end it, without notice."
      terms_disclaimer: "Disclaimer"
      terms_disclaimer_description1: "We do not guarantee that the app will always be available or free of problems. This includes while the event is taking place."
      terms_disclaimer_description2: "We are not liable for any damage you suffer from using the app, except where it is caused by our intent or gross negligence."
      terms_revision: "Changes to these terms"
      terms_revision_description1: "We may revise these terms when needed. When we do, we will announce it on this page. If you use the app after a revision, you agree to the revised terms."
      terms_governing_law: "Governing law"
      terms_governing_law_description1: "These terms are governed by the laws of Japan."
      terms_code_of_conduct: "Anti-Harassment Policy"
      terms_code_of_conduct_description1: "In addition to these terms, users of the app must follow the Kaigi on Rails Anti-Harassment Policy."
      terms_code_of_conduct_link: "Kaigi on Rails Anti-Harassment Policy"
      terms_code_of_conduct_url: "https://kaigionrails.org/%{year}/policies/"
